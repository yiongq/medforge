# 三件事:lint、测试、数据管线冒烟(不触网部分)。
# 训练/评测不进 CI——它们要 GPU 和百 MB 级数据,由租卡 checklist 覆盖。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
