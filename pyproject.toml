[project]
name = "medforge"
version = "0.1.0"
description = "医疗推理小模型全流程:可验证数据 → SFT → 验证器驱动 DPO/GRPO → 对照评测 → 生产级部署"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # 刻意保持轻:本机只做数据工程/验证器/报告,不装 torch——
    # 训练与推理发生在租用 GPU 上,由 scripts/autodl_bootstrap.sh 安装 ms-swift/vLLM
    "datasets>=3.0",
    "huggingface_hub>=0.26,<1.0",  # transformers 运行时硬检查 <1.0(wheel 元数据反而不拦),GPU 机上实测炸过
    "pyyaml>=6.0",
    "openai>=1.50",       # 验证器 LLM 兜底,走 OpenAI 兼容接口,provider 无关
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medforge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
