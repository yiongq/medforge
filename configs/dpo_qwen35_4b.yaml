# DPO 阶段二:在 SFT 产物之上做偏好对齐
# 偏好对来源:同题采样 8 解 → 验证器判分 → 对/错配对(build_dpo.py,W2 实现)
# 运行:swift rlhf configs/dpo_qwen35_4b.yaml   (yaml 是位置参数;rlhf_type 已写在本文件内)
# 参数名以 ms-swift 锁定版本的官方文档为准

# 起点改为基座(W2 实测:med-o1-zh 蒸馏 SFT 使三卷全跌 ~11pp——2024 年浅层 CoT
# 覆盖了 2026 思考型基座的原生深推理,负结果存档于 reports;DPO 直接在基座上
# 用「它自己的对/错解」纠偏,保留原生思考风格)
model: Qwen/Qwen3.5-4B
tuner_type: lora
target_modules: all-linear
lora_rank: 64
lora_alpha: 128

rlhf_type: dpo
beta: 0.1                # DPO 论文默认;【暂定】W2 对 0.05/0.1/0.3 做对照
learning_rate: 5.0e-6    # DPO 惯例比 SFT 低一个数量级以上,防把 SFT 学到的能力洗掉
num_train_epochs: 1      # 偏好数据过多轮极易过拟合,业界惯例 1 epoch

per_device_train_batch_size: 1   # DPO 同时前向 chosen/rejected 且解法长达 8K token,批次只能为 1
gradient_accumulation_steps: 16
max_length: 8192         # 80G 卡余量允许;DPO 显存账:fp32 全词表概率 ≈ 长度×词表×4B×2份,10240 实测 OOM(要 13GB);
                         # 6144 容纳绝大多数对子(chosen 本就取最短对解),超长对子直接剔除
truncation_strategy: delete  # 超长不截断而是丢弃:截半的坏解会污染偏好信号
lazy_tokenize: false     # 关懒加载:超长样本在开训前统一剔除并打印数量,而不是训到 41% 才炸(实测)
torch_dtype: bfloat16
gradient_checkpointing: true
use_liger_kernel: true   # 融合算子免实体化全词表概率——长序列 DPO 的显存正解(6144+batch1 仍 OOM 实测)
seed: 42

dataset: data/processed/dpo_pairs.jsonl
save_steps: 100
logging_steps: 10
output_dir: output/dpo_qwen35_4b

report_to: swanlab
swanlab_project: medforge
