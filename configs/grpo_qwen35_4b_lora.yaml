# 第三阶段 GRPO:在弃权 SFT 模型之上,用「验证器现算的选择性预测奖励」做可验证 RL。
# 单卡 RTX 5090(32 GB),ms-swift 4.5.2,colocate rollout(训练与 vLLM 同卡分显存)。
# 运行:bash scripts/train_grpo.sh(不要直接 swift rlhf,脚本里有 vllm/参数名两道前置闸)
#
# 训练线位置:蒸馏 SFT(阶段一,output/sft_distill_v1/merged,CMExam 严格口径 80.4%)
#             → 弃权 SFT(阶段二,教「答案:不确定」这条字面收尾)
#             → 本配置(阶段三,教「什么时候该说不确定」)。
# 奖励表 +1 / 0 / -1 让弃权恰在 p(答对) < 0.5 时最优,详见 src/medforge/train/grpo_reward.py 的模块注释。
#
# ── 每个非显然键来自哪个 dataclass(读 ms-swift 4.5.2 wheel 源码逐个核对,不是抄博客)──────────
#   rlhf_type / beta / temperature / max_completion_length   swift/arguments/rlhf_args.py  RLHFArguments
#   num_generations / reward_funcs / reward_weights /
#     log_completions                                        swift/arguments/rlhf_args.py  GRPOArguments
#   epsilon / epsilon_high / overlong_filter /
#     num_generations_eval                                   swift/rlhf_trainers/args_mixin.py  GRPOArgumentsMixin
#   use_vllm / vllm_mode / top_p / top_k / min_p / sleep_level /
#     offload_model / offload_optimizer / lora_rank          swift/rlhf_trainers/args_mixin.py  RolloutTrainerArgumentsMixin
#   vllm_gpu_memory_utilization / vllm_max_model_len         swift/rlhf_trainers/args_mixin.py  VllmArguments
#   external_plugins / tuner_type / seed                     swift/arguments/base_args/base_args.py  BaseArguments
#   dataset / val_dataset                                    swift/arguments/base_args/data_args.py  DataArguments
#   model / torch_dtype                                      swift/arguments/base_args/model_args.py  ModelArguments
#   max_length / enable_thinking                             swift/arguments/base_args/template_args.py  TemplateArguments
#   target_modules / lora_alpha / lora_dropout               swift/arguments/tuner_args.py  TunerArguments
#   learning_rate / eval_strategy / output_dir               swift/arguments/sft_args.py  SftArguments
#   swanlab_project / swanlab_mode                           swift/arguments/sft_args.py  SwanlabArguments
#   lr_scheduler_type / warmup_ratio / per_device_*_batch_size /
#     gradient_accumulation_steps / gradient_checkpointing /
#     logging_steps / report_to                              swift/trainers/arguments.py  TrainArgumentsMixin
#   max_steps / save_steps / save_total_limit / eval_steps   transformers Seq2SeqTrainingArguments
#                                                            (SftArguments 继承 swift.trainers.arguments.Seq2SeqTrainingArguments)
# 注意 lora_rank 在 4.5.2 里被 RolloutTrainerArgumentsMixin 重定义(默认 8,给 vllm lora adapter 用),
# 但它和 TunerArguments 的 LoRA rank 是同一个字段名,写一次两边都吃到——与 SFT 配置保持 64 不变。

rlhf_type: grpo

# 阶段三接在阶段二之上。若跳过弃权 SFT,把这里指向 output/sft_distill_v1/merged
# (奖励表本身就能教出弃权,弃权 SFT 只是先把「答案:不确定」这个字面格式喂熟,省掉冷启动)
model: output/sft_abstain_v1/merged
torch_dtype: bfloat16

# LoRA 与 SFT 配置同规格:换了秩就没法说「差别来自 GRPO 而不是容量」
tuner_type: lora
target_modules: all-linear
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

# RL 的学习率必须比 SFT 低一个数量级:GRPO 的梯度来自组内优势,lr 大了几十步就把 SFT 学到的格式冲掉
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
gradient_checkpointing: true
use_liger_kernel: true            # 走 LigerFusedLinearGRPOLoss(分块算 loss,不落 4k×25万 的 fp32 logits):实测不开时训练相跑到第 3 步 OOM(差 1 GB)
seed: 42

dataset: data/processed/grpo_train_unstable.jsonl   # 只用蒸馏模型 4 次采样里 1~3 次答对的题(弃权阶段分出的 unstable,未进过任何教材):全对/全错的题组内奖励无方差、纯烧卡——实测随机切片时 60~69% 的组零方差
val_dataset: data/processed/grpo_eval_unstable.jsonl  # 同一批 unstable 题里留出的 100 题

# 一次 rollout 出 8 个解:GRPO 的优势是组内标准化出来的,组太小(< 4)优势噪声压不住。
# 注意 generation_batch_size 数的是 completion 总数而不是题数(args_mixin.py:154 的原话:
# "The total number of samples generated in one vLLM inference call"),唯一题数 = 它 / num_generations
# —— RepeatSampler 就是按 generation_batch_size // num_generations 取题的(grpo_trainer.py:177)。
#   generation_batch_size = per_device_train_batch_size × world_size × gradient_accumulation_steps
#                         = 8 × 1 × 16 = 128 条 completion = 16 道题 × 8 个解 / 每次优化器更新,
#   分成 16 个 micro-batch(每批 8 条 completion)前向,所以显存压力只由 per_device_train_batch_size 决定。
# 这里必须是 16 而不是 2:grad_accum=2 时 generation_batch_size = 8×1×2 = 16,每次更新只有 16/8 = 2 道题,策略梯度被两组基线主导,
# 是 GRPO 能配出来的最噪的一档。128 也满足 128 % num_generations == 0(_init_generation_batch_params 的硬校验)。
# 代价是每步要生成 128 条:300 步 × 128 ≈ 3.8 万条 rollout(而 grad_accum=2 时只有 4800 条),
# 单卡上这是数十小时量级的租金,先用 max_steps: 10 跑一轮量出每步耗时再决定 300 是不是跑得完。
# 题量上 300 步 × 16 题 ≈ 4800 题,正好把 build_grpo 的 6000 题吃掉八成(不到一轮)。
num_generations: 8
per_device_train_batch_size: 1    # 每个 micro-batch 的 completion 数;8 条 × 4k token × 25 万词表的 fp32 logits = 30 GiB,单卡直接 OOM(实测),只能 1
gradient_accumulation_steps: 128  # generation_batch_size = 1 × 128 = 128 条 completion = 16 题 × 8 采样,每个优化步不变

# 4096:CMExam-train 的答卷在蒸馏模型下中位 ≈ 420 token、p90 ≈ 4.7k(reports/usability-v3-train.md 的
# 「每题 token 均值 1.8k」是三卷混合值,CMExam 单卷更短)。给到 4096 覆盖住九成。
max_completion_length: 4096
max_length: 8192              # prompt 侧上限,与 SFT 一致
vllm_max_model_len: 12288     # prompt + completion 的硬上限,留出余量
# overlong_filter 在 4.5.2 里只做一件事:把截断样本的 token 从 completion_mask 里抹掉
# (grpo_trainer.py:978,发生在 compute_loss 里)。奖励与优势在这之前就算完了(grpo_trainer.py:244),
# 所以被截断的那一成答卷照样拿 UNFINISHED_REWARD=-1 并进组内均值/标准差,只是自己不贡献 loss。
# 这是刻意的,不是漏网:见 src/medforge/train/grpo_reward.py 的模块注释——「写不完」必须不比「答错」便宜,
# 否则模型会发现转圈到撞上限是最省事的逃生门(W2 实测过 DPO 的这个退化方向)。
# 若哪天改主意认为截断不该带信号,就把 MEDFORGE_GRPO_UNFINISHED_REWARD 设成 0(与弃权同为基线中性),
# 而不是指望 overlong_filter 替你把 -1 从优势里摘掉。
overlong_filter: true

# 解码尽量对齐评测 sample 臂(scripts/eval_p2_arms.sh 的 --temperature 1.0 --top-p 0.95 --top-k 20
# --min-p 0 --presence-penalty 1.5):训练与考卷的分布漂了,涨的分在考卷上兑不出来。
# top_k / min_p 必须显式写:RolloutTrainerArgumentsMixin 的默认是 top_k=-1(不截断)、min_p=0.0,
# 而 rollout 的 RequestConfig 恰好逐字段读这几个 arg(rollout_mixin.py:356)。
# 残留差异一条,说清楚不遮掩:presence_penalty 在 4.5.2 里没有对应的 rollout 参数
# (RequestConfig 有这个字段,但 RolloutTrainerArgumentsMixin 里没有可以填它的 arg,只有 repetition_penalty),
# 所以评测臂那份 1.5 的存在惩罚在训练侧无法复现,训练分布比考卷略松。
temperature: 1.0
top_p: 0.95
top_k: 20
min_p: 0
# 必须显式打开思考:qwen3_5 模板的 non_thinking_prefix 非空,而 Template.__init__ 的默认解析是
# `enable_thinking = is_thinking and not non_thinking_prefix`(swift/template/base.py:130)→ 默认 False。
# 那样 rollout 会被塞进 '<think>\n\n</think>\n\n' 前缀且该前缀不在 completion 文本里,
# 于是每条 completion 都没有 </think>,medforge_selective 会按「未收尾」全判 -1、组内零方差、300 步白烧。
enable_thinking: true

# beta = 0 → 省掉参考前向和 KL 项,也不惩罚偏离 SFT 分布。
# (注意:LoRA 本来就不会再加载一份权重——ms-swift 只在 tuner_type=full 时才建 ref_model,
#  rlhf_args.py:291-298;beta=0.04 时参考 logprob 是同一份权重关掉 adapter 算的。省的是算力不是显存。)
# 代价是可能跑飞(格式退化 / 复读),所以 log_completions 开着,前 50 步要看采样样例。
# 如果观察到格式崩坏,改 0.04(TRL/ms-swift 的常用值)重跑,别调 lr。
beta: 0.0
# epsilon / epsilon_high 留 ms-swift 默认(0.2 / None,即对称裁剪)——没有证据支持 DAPO 式非对称上界
log_completions: true

use_vllm: true
vllm_mode: colocate                  # 单卡只能同居:rollout 与训练轮流占显存
vllm_gpu_memory_utilization: 0.4     # 32 GB × 0.4 ≈ 12.8 GB 给 vLLM(4B bf16 权重 ≈ 8 GB + KV);0.3 起不来(权重之外没剩下 cache 块)
vllm_max_num_seqs: 32                # Qwen3.5 的 Mamba/GDN 层每条解码序列占一个 cache block:0.4 显存只够 121 块、0.3 更少,默认 128 并发起不来(实测 ValueError);32 并发分四波跑完 128 条 rollout
vllm_enforce_eager: true             # 不捕 CUDA graph:省 1~2 GB 显存与启动时间,rollout 慢两三成,单卡显存优先
vllm_max_lora_rank: 64               # 默认 16 < 训练用的 r=64,vLLM 侧挂 LoRA 会拒
sleep_level: 1                       # 训练步开始前让 vLLM 睡下、交还显存;不开单卡必 OOM
offload_model: true                  # 同理:rollout 期间把训练权重挪到 CPU
offload_optimizer: true
move_model_batches: 8                # 权重同步到 vLLM 分 8 批搬,压掉同步时的显存峰值(实测一次性同步要 15 GiB)

max_steps: 100                # 单卡实测约 6 分钟/步(rollout 128 条 + 128 个 micro-batch),100 步 ≈ 10 小时;812 题 × 8 采样 ≈ 2 个 epoch
save_steps: 25
save_total_limit: 2                  # RL 没有 load_best_model_at_end,留最近两个点够回滚了
logging_steps: 5
eval_strategy: steps
eval_steps: 25
per_device_eval_batch_size: 1
num_generations_eval: 1           # 评估批只能 1(logits 显存),必须能被它整除 → 验证集每题采 1 次
output_dir: output/grpo_v1

# 奖励:唯一一条,权重默认全 1,所以不写 reward_weights(写了长度必须与 reward_funcs 相等)。
# external_plugins 的路径相对仓库根;import_external_file 会 abspath 后 insert 进 sys.path
external_plugins: [src/medforge/train/grpo_reward.py]
reward_funcs: [medforge_selective]

report_to: swanlab
swanlab_project: medforge
swanlab_mode: cloud
